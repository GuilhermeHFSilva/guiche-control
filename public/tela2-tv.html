<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Público TV - SSE Queue Control</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/tv.css">
</head>
<body class="tv-body">

  <header class="tv-header">
    <div class="tv-logo">
      <span style="color: var(--accent-green);">🏥</span> CLÍNICA SANTA MARIA — ATENDIMENTO
    </div>
    <div class="tv-clock">
      <span>🕒</span> <span id="tvClock">--:--:--</span>
    </div>
  </header>

  <main class="tv-main-container">
    <!-- Banner Principal da Senha Atual Chamada -->
    <section id="tvCallBanner" class="tv-call-banner">
      <div class="tv-badge-headline">
        <span>📢</span> SENHA CHAMADA RECENTEMENTE
      </div>
      <div id="currentTicketCode" class="tv-ticket-code">---</div>
      <div id="currentGuicheDisplay" class="tv-guiche-destaque">
        <span>🚪</span> AGUARDANDO CHAMADA
      </div>
    </section>

    <!-- Painel Lateral com Histórico das Últimas Chamadas -->
    <aside class="tv-history-panel">
      <h2 class="tv-history-title">
        <span>📋</span> ÚLTIMAS CHAMADAS
      </h2>
      <div id="historyListContainer" class="tv-history-list">
        <div style="color: var(--text-muted); text-align: center; padding: 20px;">
          Nenhuma chamada registrada.
        </div>
      </div>
    </aside>
  </main>

  <footer class="tv-footer-marquee">
    <div>ℹ️ <strong>Informações:</strong> Mantenha seu documento original com foto e cartão do plano em mãos.</div>
    <div>Sinal SSE: <span style="color: var(--accent-green);">● Ao Vivo</span></div>
  </footer>

  <audio id="audioChime" preload="auto" src="/assets/audio/chime.mp3"></audio>
  <script src="/js/tv.js"></script>
</body>
</html>
